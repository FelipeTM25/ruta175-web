<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/img/icono.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600..800&family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <title>Tu código de Ruta175</title>
  <meta name="robots" content="noindex">
  <style>
    .code{font-family:ui-monospace,Menlo,monospace;font-size:clamp(26px,7vw,40px);font-weight:800;letter-spacing:.06em;background:var(--surface);border:1px solid var(--accent);border-radius:16px;padding:18px 22px;display:inline-block;user-select:all}
    button{background:var(--accent);color:#1a0b00;font-weight:800;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <main class="wrap" style="min-height:100vh;display:grid;place-content:center;gap:18px;text-align:center">
    <img src="/img/icono.svg" alt="" width="72" height="72" style="margin:0 auto;border-radius:18px">
    <h1 id="t">Confirmando tu pago…</h1>
    <p class="lede" id="d" style="margin-inline:auto">Un momento, estamos hablando con el banco.</p>
    <div id="c" hidden><span class="code" id="code"></span></div>
    <p id="a" hidden><button id="copy">Copiar código</button></p>
    <p class="lede" id="how" hidden style="margin-inline:auto">En la app: <b>¿Ya tienes un código?</b> y pégalo. Si todavía no vinculas tu moto, pégalo igual: queda guardado y se activa al vincularla. Sirve para una sola moto. <b>Guárdalo</b> (captura de pantalla).</p>
    <p><a href="/" style="color:var(--accent);font-weight:800">Volver al inicio</a></p>
  </main>
<script>
  const FN = 'https://xjbuetfrliockslghslk.supabase.co/functions/v1/wompi-codigo';
  const $ = (id) => document.getElementById(id);
  const id = new URLSearchParams(location.search).get('id');
  let intentos = 0;
  const msg = (t, d) => { $('t').textContent = t; $('d').textContent = d; };
  async function mirar() {
    if (!id) return msg('Falta el número de pago', 'Si ya pagaste, escríbenos con tu comprobante de Wompi.');
    try {
      const r = await (await fetch(FN + '?id=' + encodeURIComponent(id))).json();
      if (r.estado === 'APPROVED') {
        msg('¡Pago aprobado!', 'Este es tu código de activación:');
        $('code').textContent = r.codigo; $('c').hidden = $('a').hidden = $('how').hidden = false;
        $('copy').onclick = () => navigator.clipboard.writeText(r.codigo).then(() => ($('copy').textContent = 'Copiado ✓'));
        return;
      }
      if (r.estado === 'PENDING' && ++intentos < 60) { msg('Confirmando tu pago…', 'Estamos esperando la confirmación del banco. No cierres esta página.'); return setTimeout(mirar, 4000); }
      if (r.estado === 'PENDING') return msg('Tu pago todavía no llega confirmado', 'Si ya te descontaron, escríbenos a rutaadx175@gmail.com con el comprobante de Wompi y te enviamos el código. Puedes volver a abrir esta página en unos minutos.');
      if (r.estado === 'DECLINED' || r.estado === 'VOIDED') return msg('El pago no se aprobó', 'Si no se aprobó, no se te cobró nada. Puedes intentarlo de nuevo en ruta175.app/comprar.html');
      if (r.estado === 'ERROR' && r.detalle) return msg('Demasiadas consultas', 'Espera un minuto y recarga esta página.');
      msg('No pudimos confirmar el pago', 'Si te descontaron, escríbenos con tu comprobante de Wompi y te damos el código.');
    } catch { msg('Sin conexión', 'Recarga esta página para ver tu código.'); }
  }
  mirar();
</script>
</body>
</html>
